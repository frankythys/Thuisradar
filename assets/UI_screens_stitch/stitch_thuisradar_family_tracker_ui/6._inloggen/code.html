16px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col"><div class="fixed top-0 inset-x-0 z-50 h-10 px-margin flex items-center justify-between text-on-surface select-none pointer-events-none bg-surface/90 backdrop-blur-md"><span class="font-label-md text-label-md font-semibold text-on-surface tracking-tight pl-1">09:41</span><div class="flex items-center gap-1.5 pr-1 text-on-surface"><span class="material-symbols-rounded text-[18px] leading-none text-on-surface">network_wifi</span><span class="material-symbols-rounded text-[18px] leading-none text-on-surface">signal_cellular_4_bar</span><span class="material-symbols-rounded text-[20px] leading-none text-on-surface">battery_full</span></div></div><main class="flex-1 flex flex-col relative w-full pt-10 pb-safe bg-surface px-margin"><div class="flex flex-col w-full pb-8">
<div class="flex flex-col items-center pt-4 pb-6">
<div class="relative w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center shadow-sm overflow-hidden mb-3">

</div>
<span class="font-title-lg text-title-lg font-bold text-on-surface tracking-tight">Thuisradar</span>
<div class="flex items-center gap-1.5 mt-1 px-3 py-0.5 rounded-full bg-surface-container-high">
<span class="material-symbols-outlined text-[13px] text-primary" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<span class="font-label-sm text-label-sm text-primary uppercase tracking-wider font-semibold">Veilig &amp; Vertrouwd</span>
</div>
</div>
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm flex flex-col">
<div class="mb-6 text-center">
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-1.5">Welkom terug</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in om verbonden te blijven met je familie.</p>
</div>
<form class="flex flex-col gap-4" novalidate="" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold pl-1" for="email">
          E-mailadres
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[20px] text-outline pointer-events-none transition-colors duration-200">
            mail
          </span>
<input autocomplete="email" class="w-full h-[52px] pl-12 pr-4 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary transition-all duration-200" id="email" name="email" placeholder="naam@voorbeeld.be" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold pl-1" for="password">
          Wachtwoord
        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[20px] text-outline pointer-events-none transition-colors duration-200">
            lock
          </span>
<input autocomplete="current-password" class="w-full h-[52px] pl-12 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline font-body-md text-body-md rounded-xl outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
<button aria-label="Wachtwoord zichtbaarheid wisselen" class="absolute right-3.5 w-8 h-8 rounded-full flex items-center justify-center text-outline hover:text-on-surface focus:outline-none transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon">
              visibility
            </span>
</button>
</div>
</div>
<div class="flex justify-end pt-0.5">
<button class="font-label-lg text-label-lg text-primary font-semibold hover:underline focus:outline-none py-1" type="button">
          Wachtwoord vergeten?
        </button>
</div>
<button class="w-full h-[52px] rounded-full bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] transition-all duration-150 mt-2" type="submit">
<span>Inloggen</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="relative my-6 flex items-center justify-center">
<div class="w-full h-px bg-surface-variant"></div>
<span class="absolute px-3 bg-surface-container-lowest font-label-sm text-label-sm text-outline uppercase tracking-wider">
        of
      </span>
</div>
<button class="w-full h-[48px] rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container font-label-md text-label-md font-semibold flex items-center justify-center gap-2 transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">
        fingerprint
      </span>
<span>Inloggen met biometrie</span>
</button>
</div>
<div class="mt-6 flex flex-col items-center gap-4 text-center">
<div class="flex items-center justify-center gap-1.5 font-body-md text-body-md text-on-surface-variant">
<span>Nog geen account?</span>
<button class="font-label-lg text-label-lg text-primary font-bold hover:underline focus:outline-none" type="button">
        Registreren
      </button>
</div>
<div class="flex items-center justify-center gap-4 text-outline font-label-sm text-label-sm pt-2">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">lock_reset</span>
<span>End-to-end beveiligd</span>
</span>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">family_restroom</span>
<span>Alleen voor gezinnen</span>
</span>
</div>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if (toggleBtn && pwdInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
